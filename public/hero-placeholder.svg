<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600" role="img" aria-label="Hero photo placeholder">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2521" />
      <stop offset="55%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#14110f" />
    </linearGradient>
  </defs>

  <rect width="2400" height="1600" fill="url(#warm)" />

  <!-- corner framing marks -->
  <g stroke="#c9a882" stroke-opacity="0.45" stroke-width="5" fill="none">
    <path d="M200 340 V200 H340" />
    <path d="M2060 200 H2200 V340" />
    <path d="M2200 1260 V1400 H2060" />
    <path d="M340 1400 H200 V1260" />
  </g>

  <!-- center reticle -->
  <g stroke="#c9a882" stroke-opacity="0.3" stroke-width="4" fill="none">
    <circle cx="1200" cy="720" r="86" />
    <path d="M1200 600 V656 M1200 784 V840 M1080 720 H1136 M1264 720 H1320" />
  </g>

  <g
    fill="#c9a882"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    text-anchor="middle"
  >
    <text x="1200" y="920" font-size="60" font-weight="600" letter-spacing="14">HERO PHOTO</text>
    <text x="1200" y="1000" font-size="34" fill-opacity="0.6" letter-spacing="4">
      drop yours at public/hero.jpg
    </text>
    <text x="1200" y="1056" font-size="28" fill-opacity="0.4" letter-spacing="3">
      landscape, 2400 × 1600 or larger
    </text>
  </g>
</svg>
